[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-app-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Flask>=3.0,<4"]

[tool.pytest.ini_options]
testpaths = ["tests/author"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
